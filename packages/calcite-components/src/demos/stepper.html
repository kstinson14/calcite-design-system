<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Stepper</title>
    <style>
      .parent-flex {
        display: flex;
        width: 80%;
        padding: 25px 0;
        color: var(--calcite-color-text-3);
        font-family: var(--calcite-font-family);
        font-size: var(--calcite-font-size-0);
        font-weight: var(--calcite-font-weight-medium);
      }

      .child-flex {
        flex: 0 0 85%;
        padding: 0 20px;
      }

      .vertical-child-flex {
        flex: 0 0 30%;
        padding: 0 20px;
      }

      .right-aligned-text {
        text-align: right;
        flex: 0 0 15%;
      }

      hr {
        margin: 50px 0;
        border-top: 1px solid var(--calcite-color-border-2);
      }
    </style>
    <script src="./_assets/head.ts"></script>
  </head>

  <body>
    <demo-dom-swapper>
      <!--
      **************************************************
      * SMALL horizontal-single
      **************************************************
    -->

      <!--
      **************************************************
      * LARGE
      **************************************************
    -->
      <!-- headers -->
      <div class="parent-flex">
        <div class="child-flex right-aligned-text"></div>
        <div class="child-flex">Large horizontal</div>
      </div>

      <div class="parent-flex">
        <div class="child-flex right-aligned-text">complete, active, error, idle + icons</div>
        <calcite-button onclick="addItem()"></calcite-button>
        <script>
          const addItem = () => {
            const newItem = document.createElement("calcite-stepper-item");
            const newNotice = document.querySelector("#thisnotice").cloneNode();
            debugger;
            newItem.append(newNotice);
            newItem.heading = "New";
            debugger;
            document.querySelector("#thisstepper").append(newItem);
          };
        </script>

        <div class="child-flex">
          <calcite-stepper id="thisstepper" numbered icon scale="l">
            <calcite-stepper-item heading="Choose method" complete>
              <calcite-notice id="thisnotice" open width="full">
                <div slot="message">Step 1 Content Goes Here</div>
              </calcite-notice>
            </calcite-stepper-item>
            <calcite-stepper-item heading="Compile member list" complete>
              <calcite-notice open width="full">
                <div slot="message">Step 2 Content Goes Here</div>
              </calcite-notice>
            </calcite-stepper-item>
            <calcite-stepper-item heading="Set member properties" description="Some subtext" error>
              <calcite-notice open width="full">
                <div slot="message">Step 3 Content Goes Here</div>
              </calcite-notice>
            </calcite-stepper-item>
            <calcite-stepper-item heading="Confirm and complete">
              <calcite-notice open width="full">
                <div slot="message">Step 4 Content Goes Here</div>
              </calcite-notice>
            </calcite-stepper-item>
          </calcite-stepper>
        </div>
      </div>
    </demo-dom-swapper>
  </body>
</html>
